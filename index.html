<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Masato's China Study & IT Tracker</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel для поддержки JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PWA Manifest -->
  <link rel="manifest" href='data:application/json,{"name":"Masato Tracker","short_name":"Tracker","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617"}'>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DAYS = [
      { id: 'mon', name: 'Понедельник', short: 'ПН', full: 'Понедельник (Математика + Python)' },
      { id: 'tue', name: 'Вторник', short: 'ВТ', full: 'Вторник (Курс Английского)' },
      { id: 'wed', name: 'Среда', short: 'СР', full: 'Среда (Математика + Python)' },
      { id: 'thu', name: 'Четверг', short: 'ЧТ', full: 'Четверг (Курс Английского)' },
      { id: 'fri', name: 'Пятница', short: 'ПТ', full: 'Пятница (Математика + Python)' },
      { id: 'sat', name: 'Суббота', short: 'СБ', full: 'Суббота (Английский + GitHub)' },
      { id: 'sun', name: 'Воскресенье', short: 'ВС', full: 'Воскресенье (Перезагрузка & Анализ)' },
    ];

    const PYTHON_TOPICS = [
      "Функции и аргументы (def, return)",
      "Списки и методы (lists, append, sort)",
      "Словари и пары ключ-значение (dicts)",
      "Циклы for и while, условие if-else",
      "Работа с файлами (open, read, write)",
      "Алгоритмы поиска и сортировки",
      "ООП: классы и объекты (class, __init__)"
    ];

    const ENGLISH_TOPICS = [
      "15 новых слов + чтение тех. статьи",
      "Грамматика: Past Simple vs Present Perfect",
      "Аудирование: видео на IT-тему с субтитрами",
      "Разбор идиом и разговорных фраз",
      "Написание эссе / пересказ текста",
      "Технический словарный запас (Computer Science)"
    ];

    const MON_WED_FRI_SCHEDULE = [
      { id: 'mwf_1', time: '16:00 - 16:30', start: '16:00', end: '16:30', title: 'Отдых после школы, перекус', category: 'rest', desc: 'Перезагрузка после школы перед учебой' },
      { id: 'mwf_2', time: '16:30 - 17:30', start: '16:30', end: '17:30', title: 'Школьные ДЗ (Математика/Физика)', category: 'school', desc: 'Выполнение текущей домашней работы' },
      { id: 'mwf_3', time: '17:30 - 17:45', start: '17:30', end: '17:45', title: 'Перерыв 15 минут', category: 'rest', desc: 'Разминка, выпить воды' },
      { id: 'mwf_4', time: '17:45 - 18:30', start: '17:45', end: '18:30', title: 'Английский', category: 'english', desc: 'DYNAMIC_ENGLISH', isDynamic: true },
      { id: 'mwf_5', time: '18:30 - 19:30', start: '18:30', end: '19:30', title: 'Ужин и отдых', category: 'rest', desc: 'Прием пищи и семейное время' },
      { id: 'mwf_6', time: '19:30 - 20:15', start: '19:30', end: '20:15', title: 'Программирование Python', category: 'python', desc: 'DYNAMIC_PYTHON', isDynamic: true },
      { id: 'mwf_7', time: '20:15 - 20:30', start: '20:15', end: '20:30', title: 'Перерыв 15 минут', category: 'rest', desc: 'Дать глазам отдохнуть' },
      { id: 'mwf_8', time: '20:30 - 21:15', start: '20:30', end: '21:15', title: 'Углубленная Математика (сложные темы)', category: 'math', desc: 'Превращаем оценку 7 в 8-9 для топовых вузов' },
      { id: 'mwf_9', time: '21:15 - 23:00', start: '21:15', end: '23:00', title: 'Свободное время, игры, отдых', category: 'rest', desc: 'Время для хобби и подготовка ко сну' }
    ];

    const TUE_THU_SCHEDULE = [
      { id: 'tt_1', time: '15:00 - 16:30', start: '15:00', end: '16:30', title: 'Курсы английского языка', category: 'english', desc: 'Занятия с преподавателем' },
      { id: 'tt_2', time: '16:30 - 17:15', start: '16:30', end: '17:15', title: 'Дорога домой, отдых', category: 'rest', desc: 'Перерыв после курсов' },
      { id: 'tt_3', time: '17:15 - 18:15', start: '17:15', end: '18:15', title: 'Школьные ДЗ', category: 'school', desc: 'Выполнение текущих уроков' },
      { id: 'tt_4', time: '18:30 - 19:30', start: '18:30', end: '19:30', title: 'Ужин и отдых', category: 'rest', desc: 'Прием пищи и короткий отдых' },
      { id: 'tt_5', time: '19:30 - 20:15', start: '19:30', end: '20:15', title: 'Домашка по курсам английского', category: 'english', desc: 'DYNAMIC_ENGLISH', isDynamic: true },
      { id: 'tt_6', time: '20:15 - 20:30', start: '20:15', end: '20:30', title: 'Перерыв 15 минут', category: 'rest', desc: 'Короткая пауза' },
      { id: 'tt_7', time: '20:30 - 21:15', start: '20:30', end: '21:15', title: 'Программирование (Практика, алгоритмы)', category: 'python', desc: 'DYNAMIC_PYTHON', isDynamic: true },
      { id: 'tt_8', time: '21:15 - 23:00', start: '21:15', end: '23:00', title: 'Свободное время', category: 'rest', desc: 'Полный отдых' }
    ];

    const SAT_SCHEDULE = [
      { id: 'sat_1', time: '15:00 - 16:30', start: '15:00', end: '16:30', title: 'Курсы английского языка', category: 'english', desc: 'Субботнее занятие' },
      { id: 'sat_2', time: '16:30 - 17:15', start: '16:30', end: '17:15', title: 'Отдых после курсов', category: 'rest', desc: 'Передышка' },
      { id: 'sat_3', time: '17:15 - 18:15', start: '17:15', end: '18:15', title: 'Закрепление английского (ДЗ)', category: 'english', desc: 'DYNAMIC_ENGLISH', isDynamic: true },
      { id: 'sat_4', time: '18:30 - 19:30', start: '18:30', end: '19:30', title: 'Ужин и отдых', category: 'rest', desc: 'Прием пищи' },
      { id: 'sat_5', time: '19:30 - 20:45', start: '19:30', end: '20:45', title: 'Программирование (Проект Python + GitHub)', category: 'python', desc: 'DYNAMIC_PYTHON', isDynamic: true },
      { id: 'sat_6', time: '20:45 - 23:00', start: '20:45', end: '23:00', title: 'Отдых, Minecraft, общение', category: 'rest', desc: 'Заслуженный вечерний отдых' }
    ];

    const SUN_SCHEDULE = [
      { id: 'sun_1', time: '12:00 - 13:00', start: '12:00', end: '13:00', title: 'Разбор сложных тем по математике', category: 'math', desc: 'Спокойный анализ непонятных за неделю тем' },
      { id: 'sun_2', time: '13:00 - 13:45', start: '13:00', end: '13:45', title: 'Фоновый английский (фильм/видео)', category: 'english', desc: 'Просмотр с англ. субтитрами' },
      { id: 'sun_3', time: '13:45 - 23:00', start: '13:45', end: '23:00', title: 'ПОЛНЫЙ ОТДЫХ & ПЕРЕЗАГРУЗКА', category: 'rest', desc: 'Набор сил перед новой учебной неделей' }
    ];

    const SCHEDULES = {
      mon: MON_WED_FRI_SCHEDULE,
      tue: TUE_THU_SCHEDULE,
      wed: MON_WED_FRI_SCHEDULE,
      thu: TUE_THU_SCHEDULE,
      fri: MON_WED_FRI_SCHEDULE,
      sat: SAT_SCHEDULE,
      sun: SUN_SCHEDULE,
    };

    const CATEGORIES = {
      math: { label: 'Математика', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' },
      english: { label: 'Английский', color: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30' },
      python: { label: 'Python / IT', color: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' },
      school: { label: 'Школа ДЗ', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' },
      rest: { label: 'Отдых & Ужин', color: 'bg-slate-700/30 text-slate-400 border-slate-700/40' },
    };

    // Даты учебных четвертей 10 класса
    const QUARTERS = [
      { id: 1, name: "1-я четверть", endDate: new Date("2026-11-01T23:59:59"), active: true },
      { id: 2, name: "2-я четверть", endDate: new Date("2026-12-31T23:59:59"), active: false },
      { id: 3, name: "3-я четверть", endDate: new Date("2027-03-20T23:59:59"), active: false },
      { id: 4, name: "4-я четверть", endDate: new Date("2027-05-25T23:59:59"), active: false }
    ];

    function App() {
      const [now, setNow] = useState(new Date());

      const getCurrentDayId = (dateObj) => {
        const dayNum = dateObj.getDay();
        const map = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        return map[dayNum];
      };

      const realTodayId = getCurrentDayId(now);

      const [activeTab, setActiveTab] = useState('schedule');
      const [selectedDay, setSelectedDay] = useState(realTodayId);

      useEffect(() => {
        setSelectedDay(realTodayId);
      }, [realTodayId]);

      const [completedTasks, setCompletedTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('masato_tracker_completed');
          return saved ? JSON.parse(saved) : {};
        } catch {
          return {};
        }
      });

      // Расчет очков опыта (XP) на основе выполненных задач
      const rpgStats = useMemo(() => {
        let mathXP = 0;
        let pythonXP = 0;
        let englishXP = 0;
        let schoolXP = 0;

        Object.keys(completedTasks).forEach(key => {
          if (completedTasks[key]) {
            if (key.includes('mwf_8') || key.includes('sun_1')) mathXP += 50;
            if (key.includes('python') || key.includes('mwf_6') || key.includes('tt_7') || key.includes('sat_5')) pythonXP += 50;
            if (key.includes('english') || key.includes('mwf_4') || key.includes('tt_1') || key.includes('tt_5') || key.includes('sat_1') || key.includes('sat_3')) englishXP += 50;
            if (key.includes('school') || key.includes('mwf_2') || key.includes('tt_3')) schoolXP += 30;
          }
        });

        const calcLevel = (xp) => {
          const level = Math.floor(xp / 200) + 1;
          const currentProgress = xp % 200;
          return { level, currentProgress, max: 200 };
        };

        return {
          math: { xp: mathXP, ...calcLevel(mathXP) },
          python: { xp: pythonXP, ...calcLevel(pythonXP) },
          english: { xp: englishXP, ...calcLevel(englishXP) },
          school: { xp: schoolXP, ...calcLevel(schoolXP) }
        };
      }, [completedTasks]);

      const pythonCompletedCount = useMemo(() => {
        let count = 0;
        Object.keys(completedTasks).forEach(key => {
          if (completedTasks[key] && key.includes('python')) count++;
        });
        return count;
      }, [completedTasks]);

      const englishCompletedCount = useMemo(() => {
        let count = 0;
        Object.keys(completedTasks).forEach(key => {
          if (completedTasks[key] && key.includes('english')) count++;
        });
        return count;
      }, [completedTasks]);

      const currentPythonTopic = PYTHON_TOPICS[pythonCompletedCount % PYTHON_TOPICS.length];
      const currentEnglishTopic = ENGLISH_TOPICS[englishCompletedCount % ENGLISH_TOPICS.length];

      const [projects, setProjects] = useState(() => {
        try {
          const saved = localStorage.getItem('masato_tracker_projects');
          return saved ? JSON.parse(saved) : [
            { id: 1, title: 'China-study-tracker (PWA)', status: 'Завершен', link: 'https://github.com/sayfullomasaidov10-cyber/China-study-tracker', desc: 'Мобильный трекер учебы во весь экран' },
            { id: 2, title: 'Python Algorithms & Practice', status: 'В разработке', link: '', desc: 'Практические скрипты и структуры данных' }
          ];
        } catch {
          return [];
        }
      });

      const [newProjectTitle, setNewProjectTitle] = useState('');
      const [newProjectDesc, setNewProjectDesc] = useState('');

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        localStorage.setItem('masato_tracker_completed', JSON.stringify(completedTasks));
      }, [completedTasks]);

      useEffect(() => {
        localStorage.setItem('masato_tracker_projects', JSON.stringify(projects));
      }, [projects]);

      const formattedDate = useMemo(() => {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateStr = now.toLocaleDateString('ru-RU', options);
        return dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
      }, [now]);

      const formattedTime = useMemo(() => {
        return now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }, [now]);

      // Расчет дней до конца первой четверти
      const daysLeftQ1 = useMemo(() => {
        const target = QUARTERS[0].endDate;
        const diffTime = target - now;
        if (diffTime <= 0) return 0;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      }, [now]);

      const toggleTask = (taskId) => {
        if (selectedDay !== realTodayId) return;
        const key = `${selectedDay}_${taskId}`;
        setCompletedTasks(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const parseTime = (timeStr) => {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
      };

      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const isTodaySelected = selectedDay === realTodayId;

      const activeBlock = useMemo(() => {
        if (!isTodaySelected) return null;
        const currentSchedule = SCHEDULES[selectedDay] || [];
        return currentSchedule.find(item => {
          const startMin = parseTime(item.start);
          const endMin = parseTime(item.end);
          return currentMinutes >= startMin && currentMinutes < endMin;
        });
      }, [selectedDay, isTodaySelected, currentMinutes]);

      const timeRemainingText = useMemo(() => {
        if (!activeBlock) return null;
        const endMin = parseTime(activeBlock.end);
        const diff = endMin - currentMinutes;
        if (diff <= 0) return 'Завершается...';
        const hours = Math.floor(diff / 60);
        const mins = diff % 60;
        return hours > 0 ? `${hours} ч ${mins} мин` : `${mins} мин`;
      }, [activeBlock, currentMinutes]);

      const stats = useMemo(() => {
        let totalTasks = 0;
        let completedCount = 0;
        const categoryStats = { math: 0, english: 0, python: 0, school: 0 };
        const categoryTotals = { math: 0, english: 0, python: 0, school: 0 };

        DAYS.forEach(day => {
          const schedule = SCHEDULES[day.id] || [];
          schedule.forEach(task => {
            if (task.category !== 'rest') {
              totalTasks++;
              if (categoryTotals[task.category] !== undefined) categoryTotals[task.category]++;
              const key = `${day.id}_${task.id}`;
              if (completedTasks[key]) {
                completedCount++;
                if (categoryStats[task.category] !== undefined) categoryStats[task.category]++;
              }
            }
          });
        });

        const overallPercent = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;
        return { overallPercent, completedCount, totalTasks, categoryStats, categoryTotals };
      }, [completedTasks]);

      const handleAddProject = (e) => {
        e.preventDefault();
        if (!newProjectTitle.trim()) return;
        const newProj = {
          id: Date.now(),
          title: newProjectTitle,
          desc: newProjectDesc || 'Без описания',
          status: 'В разработке',
          link: ''
        };
        setProjects([newProj, ...projects]);
        setNewProjectTitle('');
        setNewProjectDesc('');
      };

      const deleteProject = (id) => {
        setProjects(projects.filter(p => p.id !== id));
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-12">
          {/* Top Banner */}
          <div className="bg-gradient-to-r from-cyan-950 via-slate-900 to-emerald-950 border-b border-cyan-500/20 px-4 py-2.5">
            <div className="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
              <div className="flex items-center gap-2 text-cyan-300 font-medium">
                <span>📅</span>
                <span className="font-semibold">{formattedDate}</span>
              </div>
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1.5 bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-full text-slate-300 font-mono font-bold tracking-wider">
                  <span>⏰</span>
                  <span>{formattedTime}</span>
                </div>
                <span className="hidden sm:inline text-slate-400 text-[11px]">| Цель: Грант CSC (IT Вузы Китая)</span>
              </div>
            </div>
          </div>

          {/* Main Header */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-4xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-cyan-400 shadow-lg">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent">
                      Masato's China Study & IT Tracker
                    </h1>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 font-mono">
                      10 класс
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Персональный планер & трекер ежедневной подготовки</p>
                </div>
              </div>

              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-lg text-sm">
                  <span>🔥</span>
                  <span className="text-slate-300 font-medium text-xs">Прогресс:</span>
                  <span className="text-emerald-400 font-bold font-mono">{stats.overallPercent}%</span>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-4xl mx-auto px-4 flex gap-2 border-t border-slate-800/60 pt-2 pb-2 overflow-x-auto">
              <button
                onClick={() => setActiveTab('schedule')}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap ${
                  activeTab === 'schedule' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>📅</span> Расписание и Трекер
              </button>
              <button
                onClick={() => setActiveTab('analytics')}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap ${
                  activeTab === 'analytics' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>📊</span> Аналитика за Неделю
              </button>
              <button
                onClick={() => setActiveTab('github')}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap ${
                  activeTab === 'github' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>💻</span> GitHub & Python
              </button>
              <button
                onClick={() => setActiveTab('events')}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap ${
                  activeTab === 'events' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>🎯</span> События & Характеристики
              </button>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-4xl mx-auto px-4 mt-6">
            {activeTab === 'schedule' && (
              <div className="space-y-6">
                {/* Days Selector */}
                <div className="flex items-center justify-between gap-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800 overflow-x-auto">
                  <div className="grid grid-cols-7 gap-1.5 flex-1 min-w-[320px]">
                    {DAYS.map((day) => {
                      const isRealToday = day.id === realTodayId;
                      const isSelected = selectedDay === day.id;
                      return (
                        <button
                          key={day.id}
                          onClick={() => setSelectedDay(day.id)}
                          className={`relative flex flex-col items-center justify-center p-2 rounded-lg border text-xs font-medium transition ${
                            isSelected
                              ? 'bg-slate-800 border-cyan-500 text-cyan-300 shadow-md font-bold'
                              : 'bg-slate-900/40 border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                          }`}
                        >
                          {isRealToday && (
                            <span className="absolute -top-1 -right-1 flex h-2 w-2">
                              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                              <span className="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                            </span>
                          )}
                          <span className="text-xs sm:text-sm">{day.short}</span>
                          <span className="text-[9px] opacity-70 mt-0.5 hidden sm:inline">{day.name.slice(0, 3)}</span>
                        </button>
                      );
                    })}
                  </div>

                  {!isTodaySelected && (
                    <button
                      onClick={() => setSelectedDay(realTodayId)}
                      className="px-3 py-1.5 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded-lg text-xs font-medium whitespace-nowrap transition"
                      title="Вернуться к сегодняшнему дню"
                    >
                      🎯 На сегодня
                    </button>
                  )}
                </div>

                {/* Selected Day Info */}
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800">
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="text-lg font-bold text-slate-100">
                        {DAYS.find(d => d.id === selectedDay)?.full}
                      </h2>
                      {isTodaySelected ? (
                        <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[11px] px-2.5 py-0.5 rounded-full font-semibold flex items-center gap-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                          Сегодня (Активен для отметки)
                        </span>
                      ) : (
                        <span className="bg-slate-800 text-slate-400 border border-slate-700 text-[11px] px-2.5 py-0.5 rounded-full font-medium">
                          🔒 Просмотр (Только для чтения)
                        </span>
                      )}
                    </div>
                    <p className="text-xs text-slate-400 mt-1">
                      {isTodaySelected 
                        ? 'Отмечай выполненные задачи — зарабатывай XP и качай характеристики!' 
                        : 'Вы просматриваете расписание другого дня. Нажимать галочки можно только на сегодня.'}
                    </p>
                  </div>

                  {isTodaySelected && activeBlock ? (
                    <div className="flex items-center gap-3 bg-cyan-950/40 border border-cyan-500/40 px-4 py-2.5 rounded-xl animate-pulse">
                      <div>
                        <div className="text-[11px] text-cyan-300 font-semibold uppercase tracking-wider">Текущий Блок Прямо Сейчас</div>
                        <div className="text-xs font-bold text-white">{activeBlock.title}</div>
                        <div className="text-[10px] text-cyan-400 mt-0.5">Осталось: {timeRemainingText}</div>
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2 text-xs text-slate-400 bg-slate-800/40 px-3.5 py-2 rounded-xl border border-slate-800">
                      {isTodaySelected ? 'Сейчас нет активных блоков по расписанию' : 'Режим просмотра расписания'}
                    </div>
                  )}
                </div>

                {/* Task Checklist Items */}
                <div className="space-y-3">
                  {(SCHEDULES[selectedDay] || []).map((task) => {
                    const isCompleted = !!completedTasks[`${selectedDay}_${task.id}`];
                    const isActive = isTodaySelected && activeBlock?.id === task.id;
                    const categoryStyle = CATEGORIES[task.category] || CATEGORIES.rest;

                    let taskDesc = task.desc;
                    if (task.desc === 'DYNAMIC_PYTHON') {
                      taskDesc = `Текущая тема: ${currentPythonTopic}`;
                    } else if (task.desc === 'DYNAMIC_ENGLISH') {
                      taskDesc = `Текущая тема: ${currentEnglishTopic}`;
                    }

                    return (
                      <div
                        key={task.id}
                        onClick={() => toggleTask(task.id)}
                        className={`group relative flex items-start gap-4 p-4 rounded-xl border transition ${
                          isTodaySelected 
                            ? 'cursor-pointer hover:border-slate-700' 
                            : 'cursor-not-allowed opacity-80'
                        } ${
                          isActive
                            ? 'bg-slate-900 border-cyan-500 shadow-lg ring-1 ring-cyan-500/30'
                            : isCompleted
                            ? 'bg-slate-900/30 border-slate-800/60 opacity-60'
                            : 'bg-slate-900/80 border-slate-800'
                        }`}
                      >
                        <div className="mt-0.5 text-slate-500">
                          {isCompleted ? (
                            <div className="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">✓</div>
                          ) : (
                            <div className={`w-6 h-6 rounded-full border ${isTodaySelected ? 'border-slate-600 group-hover:border-cyan-400' : 'border-slate-800 bg-slate-900/50'}`}></div>
                          )}
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className={`text-xs px-2.5 py-0.5 rounded-md border font-mono font-medium ${categoryStyle.color}`}>
                              {task.time}
                            </span>
                            <span className={`text-[10px] px-2 py-0.5 rounded border ${categoryStyle.color}`}>
                              {categoryStyle.label}
                            </span>
                            {isActive && (
                              <span className="text-[10px] px-2 py-0.5 rounded bg-cyan-500 text-slate-950 font-bold uppercase tracking-wider animate-pulse">
                                Сейчас
                              </span>
                            )}
                          </div>

                          <h3 className={`text-sm font-semibold mt-1.5 ${isCompleted ? 'line-through text-slate-400' : 'text-slate-100'}`}>
                            {task.title}
                          </h3>
                          <p className={`text-xs mt-0.5 ${task.isDynamic ? 'text-cyan-300 font-medium' : 'text-slate-400'}`}>
                            {taskDesc}
                          </p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl">
                    <div className="text-slate-400 text-xs mb-2">Общий прогресс недели</div>
                    <div className="text-3xl font-extrabold text-slate-100 font-mono">{stats.overallPercent}%</div>
                    <div className="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                      <div className="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full transition-all duration-500" style={{ width: `${stats.overallPercent}%` }} />
                    </div>
                    <p className="text-[11px] text-slate-400 mt-2">Выполнено {stats.completedCount} из {stats.totalTasks} блоков</p>
                  </div>

                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl">
                    <div className="text-slate-400 text-xs mb-2">Текущая тема Python</div>
                    <div className="text-sm font-bold text-indigo-400 mt-1">{currentPythonTopic}</div>
                    <p className="text-[11px] text-slate-400 mt-2">Автоматически сменится после отметки урока.</p>
                  </div>

                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-2xl">
                    <div className="text-slate-400 text-xs mb-2">Текущая тема Английского</div>
                    <div className="text-sm font-bold text-cyan-400 mt-1">{currentEnglishTopic}</div>
                    <p className="text-[11px] text-slate-400 mt-2">Обновляется по мере вашего прогресса.</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'github' && (
              <div className="space-y-6">
                <div className="p-6 bg-slate-900 border border-slate-800 rounded-2xl">
                  <h3 className="font-bold text-slate-100 text-sm mb-4">Добавить новый Python-проект</h3>
                  <form onSubmit={handleAddProject} className="space-y-3">
                    <input
                      type="text"
                      placeholder="Название проекта..."
                      value={newProjectTitle}
                      onChange={(e) => setNewProjectTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500"
                    />
                    <textarea
                      placeholder="Краткое описание..."
                      value={newProjectDesc}
                      onChange={(e) => setNewProjectDesc(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 h-20 resize-none"
                    />
                    <button type="submit" className="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-xs transition">
                      Сохранить проект
                    </button>
                  </form>
                </div>

                <div className="space-y-3">
                  <h3 className="font-bold text-slate-300 text-sm">Мои проекты на GitHub</h3>
                  {projects.map((proj) => (
                    <div key={proj.id} className="p-4 bg-slate-900 border border-slate-800 rounded-xl flex items-start justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="font-bold text-slate-100 text-sm">{proj.title}</h4>
                          <span className="text-[10px] px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">{proj.status}</span>
                        </div>
                        <p className="text-xs text-slate-400 mt-1">{proj.desc}</p>
                        {proj.link && (
                          <a href={proj.link} target="_blank" rel="noreferrer" className="text-[11px] text-cyan-400 hover:underline flex items-center gap-1 mt-2">
                            🔗 Открыть на GitHub
                          </a>
                        )}
                      </div>
                      <button onClick={() => deleteProject(proj.id)} className="p-2 text-slate-500 hover:text-rose-400 transition" title="Удалить">
                        🗑️
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* НОВЫЙ РАЗДЕЛ: СОБЫТИЯ И RPG ХАРАКТЕРИСТИКИ */}
            {activeTab === 'events' && (
              <div className="space-y-6">
                {/* 1. Учебный Календарь Четвертей */}
                <div className="p-6 bg-slate-900 border border-slate-800 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-slate-100 text-base flex items-center gap-2">
                      <span>⏳</span> Учебный Календарь (10 Класс)
                    </h3>
                    <span className="text-xs px-2.5 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-mono">
                      2026 – 2027
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    {/* 1 Четверть - Активная с обратным отчетом */}
                    <div className="p-4 rounded-xl border bg-gradient-to-br from-cyan-950/40 to-slate-900 border-cyan-500/50 relative overflow-hidden">
                      <div className="flex items-center justify-between mb-2">
                        <span className="font-bold text-sm text-cyan-300">1-я Четверть</span>
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500 text-slate-950 font-bold uppercase animate-pulse">
                          Идёт сейчас
                        </span>
                      </div>
                      <div className="text-2xl font-black font-mono text-white mt-1">
                        {daysLeftQ1 > 0 ? `${daysLeftQ1} дней` : 'Завершена'}
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1">До окончания первой четверти и каникул</p>
                    </div>

                    {/* 2 Четверть - Без таймера */}
                    <div className="p-4 rounded-xl border bg-slate-900/50 border-slate-800/80 opacity-70">
                      <div className="flex items-center justify-between mb-2">
                        <span className="font-bold text-sm text-slate-300">2-я Четверть</span>
                        <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-500 border border-slate-700">
                          🔒 Ожидает начала
                        </span>
                      </div>
                      <div className="text-sm font-medium text-slate-500 mt-2">Таймер запустится после 1-й четверти</div>
                      <p className="text-[11px] text-slate-500 mt-1">Ноябрь – Декабрь 2026</p>
                    </div>

                    {/* 3 Четверть */}
                    <div className="p-4 rounded-xl border bg-slate-900/50 border-slate-800/80 opacity-70">
                      <div className="flex items-center justify-between mb-2">
                        <span className="font-bold text-sm text-slate-300">3-я Четверть</span>
                        <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-500 border border-slate-700">
                          🔒 Ожидает начала
                        </span>
                      </div>
                      <div className="text-sm font-medium text-slate-500 mt-2">Таймер запустится в январе</div>
                      <p className="text-[11px] text-slate-500 mt-1">Январь – Март 2027</p>
                    </div>

                    {/* 4 Четверть */}
                    <div className="p-4 rounded-xl border bg-slate-900/50 border-slate-800/80 opacity-70">
                      <div className="flex items-center justify-between mb-2">
                        <span className="font-bold text-sm text-slate-300">4-я Четверть</span>
                        <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-500 border border-slate-700">
                          🔒 Ожидает начала
                        </span>
                      </div>
                      <div className="text-sm font-medium text-slate-500 mt-2">Финальный рывок 10 класса</div>
                      <p className="text-[11px] text-slate-500 mt-1">Апрель – Май 2027</p>
                    </div>
                  </div>
                </div>

                {/* 2. Игровая Система Характеристик Персонажа (RPG Status) */}
                <div className="p-6 bg-slate-900 border border-slate-800 rounded-2xl space-y-5">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h3 className="font-extrabold text-slate-100 text-base flex items-center gap-2">
                        <span>🎮</span> Характеристики Прокачки (Masato Status)
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">Очки опыта (XP) и уровень растут при отметке задач</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Математика */}
                    <div className="p-4 bg-slate-950/60 border border-emerald-500/30 rounded-xl space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-emerald-400 flex items-center gap-1.5">
                          <span>📐</span> Высшая Математика
                        </span>
                        <span className="font-mono text-slate-300 font-bold">Уровень {rpgStats.math.level}</span>
                      </div>
                      <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                        <div 
                          className="bg-emerald-500 h-full transition-all duration-500" 
                          style={{ width: `${(rpgStats.math.currentProgress / rpgStats.math.max) * 100}%` }}
                        />
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-400 font-mono">
                        <span>Всего: {rpgStats.math.xp} XP</span>
                        <span>{rpgStats.math.currentProgress} / {rpgStats.math.max} XP</span>
                      </div>
                    </div>

                    {/* Python / Алгоритмы */}
                    <div className="p-4 bg-slate-950/60 border border-indigo-500/30 rounded-xl space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-indigo-400 flex items-center gap-1.5">
                          <span>💻</span> Python & Алгоритмы
                        </span>
                        <span className="font-mono text-slate-300 font-bold">Уровень {rpgStats.python.level}</span>
                      </div>
                      <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                        <div 
                          className="bg-indigo-500 h-full transition-all duration-500" 
                          style={{ width: `${(rpgStats.python.currentProgress / rpgStats.python.max) * 100}%` }}
                        />
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-400 font-mono">
                        <span>Всего: {rpgStats.python.xp} XP</span>
                        <span>{rpgStats.python.currentProgress} / {rpgStats.python.max} XP</span>
                      </div>
                    </div>

                    {/* Английский Язык */}
                    <div className="p-4 bg-slate-950/60 border border-cyan-500/30 rounded-xl space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-cyan-400 flex items-center gap-1.5">
                          <span>🗣️</span> Английский (IELTS B2)
                        </span>
                        <span className="font-mono text-slate-300 font-bold">Уровень {rpgStats.english.level}</span>
                      </div>
                      <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                        <div 
                          className="bg-cyan-500 h-full transition-all duration-500" 
                          style={{ width: `${(rpgStats.english.currentProgress / rpgStats.english.max) * 100}%` }}
                        />
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-400 font-mono">
                        <span>Всего: {rpgStats.english.xp} XP</span>
                        <span>{rpgStats.english.currentProgress} / {rpgStats.english.max} XP</span>
                      </div>
                    </div>

                    {/* Школьная Дисциплина */}
                    <div className="p-4 bg-slate-950/60 border border-amber-500/30 rounded-xl space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-amber-400 flex items-center gap-1.5">
                          <span>📚</span> Школьный Аттестат (GPA)
                        </span>
                        <span className="font-mono text-slate-300 font-bold">Уровень {rpgStats.school.level}</span>
                      </div>
                      <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                        <div 
                          className="bg-amber-500 h-full transition-all duration-500" 
                          style={{ width: `${(rpgStats.school.currentProgress / rpgStats.school.max) * 100}%` }}
                        />
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-400 font-mono">
                        <span>Всего: {rpgStats.school.xp} XP</span>
                        <span>{rpgStats.school.currentProgress} / {rpgStats.school.max} XP</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
