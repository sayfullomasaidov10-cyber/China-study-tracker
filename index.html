<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Masato's China Study & IT Tracker</title>
  <!-- React, ReactDOM, Babel & Tailwind via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PWA Manifest for Fullscreen standalone mode -->
  <link rel="manifest" href='data:application/json,{"name":"Masato Tracker","short_name":"Tracker","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a"}'>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SCHEDULE = {
      0: {
        name: "Понедельник (Математика + Python)",
        blocks: [
          { time: "16:00 - 16:30", title: "Отдых после школы, перекус", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "16:30 - 17:30", title: "Школьные ДЗ (Математика/Физика)", tag: "Школа ДЗ", color: "bg-blue-500/10 text-blue-400 border-blue-500/20" },
          { time: "17:30 - 18:30", title: "Python & Алгоритмы (Код / GitHub)", tag: "IT & Python", color: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20" },
          { time: "18:30 - 19:30", title: "Ужин и семейное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "19:30 - 20:30", title: "IELTS / Английский Vocabulary", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" },
          { time: "20:30 - 21:30", title: "Повторение математики & Анализ ошибок", tag: "Математика", color: "bg-amber-500/10 text-amber-400 border-amber-500/20" },
          { time: "21:30 - 22:30", title: "Чтение/Отдых & Итоги дня", tag: "Отдых & Ужин", color: "bg-slate-700/30 text-slate-400 border-slate-600/30" }
        ]
      },
      1: {
        name: "Вторник (Английский курсы)",
        blocks: [
          { time: "15:00 - 16:30", title: "Занятия по английскому языку", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" },
          { time: "16:30 - 17:30", title: "Отдых и разбор урока", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "17:30 - 18:30", title: "Школьные домашние задания", tag: "Школа ДЗ", color: "bg-blue-500/10 text-blue-400 border-blue-500/20" },
          { time: "18:30 - 19:30", title: "Ужин и семейное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "19:30 - 21:00", title: "Python разработка / GitHub пет-проект", tag: "IT & Python", color: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20" },
          { time: "21:00 - 22:00", title: "ДЗ по английскому & Vocabulary Practice", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" }
        ]
      },
      2: {
        name: "Среда (Математика + Python)",
        blocks: [
          { time: "16:00 - 16:30", title: "Отдых после школы, перекус", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "16:30 - 17:30", title: "Школьные ДЗ (Математика/Физика)", tag: "Школа ДЗ", color: "bg-blue-500/10 text-blue-400 border-blue-500/20" },
          { time: "17:30 - 18:30", title: "Python & Алгоритмы (Код / GitHub)", tag: "IT & Python", color: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20" },
          { time: "18:30 - 19:30", title: "Ужин и семейное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "19:30 - 20:30", title: "IELTS Reading / Listening Практика", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" },
          { time: "20:30 - 21:30", title: "Углубленная математика", tag: "Математика", color: "bg-amber-500/10 text-amber-400 border-amber-500/20" }
        ]
      },
      3: {
        name: "Четверг (Английский курсы)",
        blocks: [
          { time: "15:00 - 16:30", title: "Занятия по английскому языку", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" },
          { time: "16:30 - 17:30", title: "Отдых и домашнее задание школы", tag: "Школа ДЗ", color: "bg-blue-500/10 text-blue-400 border-blue-500/20" },
          { time: "17:30 - 18:30", title: "Python Практика (ООП / Проекты)", tag: "IT & Python", color: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20" },
          { time: "18:30 - 19:30", title: "Ужин и семейное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "19:30 - 21:00", title: "IELTS Writing / Speaking подборка слов", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" }
        ]
      },
      4: {
        name: "Пятница (Математика + Проекты)",
        blocks: [
          { time: "16:00 - 16:30", title: "Отдых после школы, перекус", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "16:30 - 17:30", title: "Школьные ДЗ", tag: "Школа ДЗ", color: "bg-blue-500/10 text-blue-400 border-blue-500/20" },
          { time: "17:30 - 18:30", title: "Математика (Решение сложных задач)", tag: "Математика", color: "bg-amber-500/10 text-amber-400 border-amber-500/20" },
          { time: "18:30 - 19:30", title: "Ужин и семейное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "19:30 - 21:00", title: "GitHub & Python (Коммиты и рефакторинг)", tag: "IT & Python", color: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20" }
        ]
      },
      5: {
        name: "Суббота (Английский + Обзор недели)",
        blocks: [
          { time: "15:00 - 16:30", title: "Занятия по английскому языку", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" },
          { time: "16:30 - 18:00", title: "Отдых и личное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "18:30 - 19:30", title: "Ужин и семейное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "19:30 - 21:00", title: "Анализ прогресса за неделю & Планирование", tag: "Аналитика", color: "bg-purple-500/10 text-purple-400 border-purple-500/20" }
        ]
      },
      6: {
        name: "Воскресенье (Перезагрузка & Проекты)",
        blocks: [
          { time: "11:00 - 13:00", title: "Творческий IT-проект / Изучение технологии", tag: "IT & Python", color: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20" },
          { time: "13:00 - 14:00", title: "Прогулка / Отдых", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
          { time: "16:00 - 18:00", title: "Чтение английской литературы / Просмотр лекций", tag: "IELTS Prep", color: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20" },
          { time: "18:30 - 19:30", title: "Ужин и семейное время", tag: "Отдых & Ужин", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" }
        ]
      }
    };

    function App() {
      const [selectedDay, setSelectedDay] = useState(0);
      const [checkedTasks, setCheckedTasks] = useState(() => {
        const saved = localStorage.getItem('masato_tracker_tasks');
        return saved ? JSON.parse(saved) : {};
      });
      const [now, setNow] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const toggleTask = (dayIndex, taskIndex) => {
        const key = `${dayIndex}-${taskIndex}`;
        const updated = { ...checkedTasks, [key]: !checkedTasks[key] };
        setCheckedTasks(updated);
        localStorage.setItem('masato_tracker_tasks', JSON.stringify(updated));
      };

      const daysList = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];
      const daysFull = ["Пон", "Втор", "Сред", "Четв", "Пятн", "Субб", "Воск"];

      const dateString = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const timeString = now.toLocaleTimeString('ru-RU');

      return (
        <div className="max-w-2xl mx-auto p-4 sm:p-6 pb-20">
          {/* Header Banner */}
          <header className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 mb-6 backdrop-blur shadow-xl">
            <div className="text-center pb-4 mb-4 border-b border-slate-700/60">
              <p className="text-cyan-400 font-semibold text-sm capitalize flex items-center justify-center gap-2">
                <span>📅</span> {dateString}
              </p>
              <div className="text-3xl font-black text-white tracking-wider mt-1 font-mono">
                {timeString}
              </div>
            </div>

            <div className="flex justify-between items-start gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <div className="p-2 bg-cyan-500/20 text-cyan-400 rounded-lg text-lg">⚡</div>
                  <div>
                    <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                      Masato's China Study & IT Tracker
                    </h1>
                    <p className="text-xs text-slate-400">Персональный планер & трекер подготовки</p>
                  </div>
                </div>
              </div>
              <span className="px-2.5 py-1 bg-slate-700/60 text-slate-300 text-xs rounded-full font-medium border border-slate-600/40">
                10 класс
              </span>
            </div>
          </header>

          {/* Day Navigation */}
          <div className="flex gap-2 overflow-x-auto pb-2 mb-6 no-scrollbar">
            {daysList.map((day, idx) => (
              <button
                key={day}
                onClick={() => setSelectedDay(idx)}
                className={`flex-1 min-w-[60px] py-2.5 px-3 rounded-xl border text-center transition-all ${
                  selectedDay === idx 
                    ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 shadow-lg shadow-cyan-500/10 font-bold' 
                    : 'bg-slate-800/50 border-slate-700/60 text-slate-400 hover:bg-slate-800'
                }`}
              >
                <div className="text-sm">{day}</div>
                <div className="text-[10px] opacity-60 font-normal">{daysFull[idx]}</div>
              </button>
            ))}
          </div>

          {/* Schedule Content */}
          <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 mb-6">
            <h2 className="text-lg font-bold text-white mb-1">
              {SCHEDULE[selectedDay].name}
            </h2>
            <p className="text-xs text-slate-400 mb-5">Отмечай выполненные задачи галочками для расчета недельного прогресса</p>

            <div className="space-y-3">
              {SCHEDULE[selectedDay].blocks.map((block, idx) => {
                const isChecked = !!checkedTasks[`${selectedDay}-${idx}`];
                return (
                  <div 
                    key={idx} 
                    onClick={() => toggleTask(selectedDay, idx)}
                    className={`p-3.5 rounded-xl border transition-all cursor-pointer flex items-center gap-3.5 ${
                      isChecked 
                        ? 'bg-slate-800/30 border-slate-700/40 opacity-60' 
                        : 'bg-slate-800/90 border-slate-700/80 hover:border-slate-600'
                    }`}
                  >
                    <div className={`w-6 h-6 rounded-lg border flex items-center justify-center text-xs transition-all ${
                      isChecked ? 'bg-cyan-500 border-cyan-400 text-slate-900 font-bold' : 'border-slate-600'
                    }`}>
                      {isChecked && "✓"}
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-xs font-mono text-slate-400">{block.time}</span>
                        <span className={`text-[10px] px-2 py-0.5 rounded-md border font-medium ${block.color}`}>
                          {block.tag}
                        </span>
                      </div>
                      <div className={`text-sm ${isChecked ? 'line-through text-slate-500' : 'text-slate-200 font-medium'}`}>
                        {block.title}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
